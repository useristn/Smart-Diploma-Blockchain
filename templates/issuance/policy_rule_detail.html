{% extends "base.html" %}

{% block page_title %}Chi tiết policy rule{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <div class="small text-muted">{{ rule.code }}</div>
        <h2 class="h4">{{ rule.name }}</h2>
        <p>{{ rule.description|default:"Không có mô tả." }}</p>
        <pre class="mb-0">{{ rule.expression_json|safe }}</pre>
    </div>
</div>
{% endblock %}
